name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck and test
    runs-on: ubuntu-latest

    # Real Postgres and Redis, not mocks. The wire-format contract test boots
    # the real API and asserts its actual responses, so it cannot run against a
    # stand-in — and a substitute would make the guarantee meaningless.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: correnthian
          POSTGRES_PASSWORD: correnthian
          POSTGRES_DB: correnthian
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U correnthian -d correnthian"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      DATABASE_URL: postgresql://correnthian:correnthian@localhost:5432/correnthian
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: error
      # Lets the contract suite refuse to skip rather than pass vacuously.
      CI: 'true'
      # Read by the contract suite at Test time, not Seed time. Declaring them
      # only on the Seed step left CI authenticating as an account it never
      # created, and failing for a reason that looked like a contract bug.
      CONTRACT_TEST_EMAIL: ci@correnthian.test
      CONTRACT_TEST_PASSWORD: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        # packages/* compile to dist; the apps and the API consume the built
        # output, so this has to precede typecheck and test.
        run: pnpm --filter './packages/*' build

      - name: Migrate
        run: pnpm --filter @correnthian/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed
        # The contract test authenticates as a seeded admin, so CI needs one.
        run: pnpm --filter @correnthian/api exec prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ADMIN_EMAIL: ci@correnthian.test
          ADMIN_PASSWORD: ci-only-not-a-secret
          ADMIN_PASSWORD_MIN_LENGTH: '8'

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # `pnpm test` matches `**/*.spec.ts` and `test:e2e` matches
      # `**/*.e2e-spec.ts`; neither runs the other. This step is why DEF-013
      # existed: the scaffold e2e asserted `GET /` returned `Hello World!`,
      # there is no root route, and no build ever turned red — a failing test
      # nobody runs is not a failing test.
      - name: Test (e2e)
        run: pnpm --filter @correnthian/api test:e2e

  key-boundary:
    name: Static guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: wallet-core must have no transport, UI or provider dependencies
        run: node scripts/check-key-boundary.mjs

      - name: Nest DI must be explicit
        # Implicit injection resolves under tsc and silently yields undefined
        # under esbuild. It has shipped broken three times here.
        run: node scripts/check-explicit-di.mjs

      - name: Prisma writes must use declared fields
        # Prisma types `data` as a XOR union, which defeats the excess-property
        # check, so a typo in any `data` compiles and 500s at runtime. This ran
        # broken and green for weeks precisely because CI did not invoke it —
        # a check nobody wires up is a comment.
        run: node scripts/check-prisma-writes.mjs

      - name: The task summary must agree with the task entries
        # `BACKEND_TASKS.md` §21 has been wrong three times running, including
        # in a version that told the reader it had been recomputed "not from
        # memory". The counts are recoverable from the entries, so they are
        # recomputed here rather than trusted.
        run: node scripts/check-task-counts.mjs

      - name: Production dependencies must have no untriaged high/critical
        # `pnpm audit` reports severity, not reachability — the four current
        # highs are all build/dev-tooling chains. Gating on "any high" would
        # fail forever and get disabled; gating on untriaged ones fails only
        # when a human has not looked yet. Triage lives in the script.
        run: node scripts/check-deps.mjs

  credential-scan:
    name: No credentials in env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no secret-shaped values outside test fixtures
        # Subsumes the old inline grep over *.env*: PEM blocks anywhere,
        # key-material assignments in any file, vendor token shapes outside
        # specs. Four doc lines were reworded to describe the pattern
        # without writing it, rather than excluded — an exclusion for docs/
        # would let a pasted key sit in markdown forever.
        run: node scripts/check-secrets.mjs
