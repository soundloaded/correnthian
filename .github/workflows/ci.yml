name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  secret-scan:
    name: Key-boundary guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no key material can reach the server environment
        run: |
          if grep -rInE '(PRIVATE_KEY|MNEMONIC|SEED_PHRASE)\s*=' --include='*.env*' .; then
            echo "FAIL: key material found in an environment file. This breaks the key boundary."
            exit 1
          fi
          echo "OK: no key material in environment files"
