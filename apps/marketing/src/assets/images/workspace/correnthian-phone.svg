<svg width="469" height="745" viewBox="0 0 469 745" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cpTitle cpDesc">
<title id="cpTitle">Correnthian digital vault dashboard</title>
